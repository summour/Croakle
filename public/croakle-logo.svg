<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  {/* Dark Cozy Background */}
  <rect width="32" height="32" rx="6" fill="#1C1916" />
  
  {/* Golden Sparkles */}
  <rect x="25" y="4" width="2" height="2" fill="#FACC15" />
  <rect x="24" y="5" width="4" height="1" fill="#FACC15" />
  <rect x="5" y="6" width="2" height="2" fill="#EAB308" />

  {/* Frog Eyes Outlines */}
  <rect x="6" y="7" width="7" height="6" fill="#2D3A20" />
  <rect x="19" y="7" width="7" height="6" fill="#2D3A20" />
  
  {/* Eye Inner Green & White Reflections */}
  <rect x="7" y="8" width="5" height="4" fill="#75A65A" />
  <rect x="20" y="8" width="5" height="4" fill="#75A65A" />
  <rect x="8" y="9" width="2" height="2" fill="#FFFFFF" />
  <rect x="21" y="9" width="2" height="2" fill="#FFFFFF" />

  {/* Frog Head & Body */}
  <rect x="5" y="12" width="22" height="12" fill="#75A65A" />
  <rect x="4" y="13" width="1" height="10" fill="#2D3A20" />
  <rect x="27" y="13" width="1" height="10" fill="#2D3A20" />
  <rect x="9" y="11" width="14" height="2" fill="#2D3A20" />
  <rect x="6" y="24" width="20" height="1" fill="#2D3A20" />

  {/* Rosy Warm Cheeks */}
  <rect x="6" y="17" width="3" height="2" fill="#E88B8B" />
  <rect x="23" y="17" width="3" height="2" fill="#E88B8B" />

  {/* Big Happy Pixel Smile */}
  <rect x="12" y="19" width="8" height="2" fill="#2D3A20" />
  <rect x="11" y="18" width="2" height="2" fill="#2D3A20" />
  <rect x="19" y="18" width="2" height="2" fill="#2D3A20" />

  {/* White / Cream Belly */}
  <rect x="11" y="21" width="10" height="3" fill="#FEF9C3" />
</svg>
